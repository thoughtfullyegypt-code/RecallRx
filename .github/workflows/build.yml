name: Build IPA
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          xcodebuild -project RecallRx.xcodeproj -scheme RecallRx \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" build
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/RecallRx.app Payload/
          zip -r RecallRx.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: RecallRx-ipa
          path: RecallRx.ipa
