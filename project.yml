name: AnkiClone
options:
  bundleIdPrefix: com.recallrx
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
settings:
  SWIFT_VERSION: "5.9"
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"
  GENERATE_INFOPLIST_FILE: YES
  INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
  INFOPLIST_KEY_UILaunchScreen_Generation: YES
  INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
targets:
  AnkiClone:
    type: application
    platform: iOS
    sources:
      - path: AnkiClone
        excludes:
          - "*.xcodeproj"
          - "*.xcworkspace"
    dependencies:
      - target: RecallRxWidget
        embed: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.recallrx.app
      INFOPLIST_KEY_CFBundleDisplayName: "RecallRx"
      INFOPLIST_KEY_NSMicrophoneUsageDescription: "RecallRx uses the microphone so you can answer cards hands-free. Audio stays on this iPhone."
      INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "RecallRx turns your spoken answer into a grade with on-device speech recognition."
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      CODE_SIGN_ENTITLEMENTS: AnkiClone/RecallRx.entitlements
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_STYLE: Automatic
      SWIFT_EMIT_LOC_STRINGS: YES
      OTHER_LDFLAGS: "-lz"
  RecallRxWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: RecallRxWidget
        excludes:
          - Info.plist
          - "*.entitlements"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.recallrx.app.widget
      INFOPLIST_FILE: RecallRxWidget/Info.plist
      GENERATE_INFOPLIST_FILE: NO
      CODE_SIGN_ENTITLEMENTS: RecallRxWidget/RecallRxWidget.entitlements
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: ""
      SWIFT_EMIT_LOC_STRINGS: YES
